<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的信息</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar"><div class="logo">我的信息</div>
<div class="user-area"><a href="/home" class="link-btn">返回首页</a></div></header>
<main class="container">
  <section class="card">
    <h3>基本信息</h3>
    <table class="grid">
      <tr><td>账号ID</td><td id="accountId">—</td></tr>
      <tr><td>用户名</td><td id="username">—</td></tr>
      <tr><td>真实姓名</td><td id="realName">—</td></tr>
      <tr><td>身份</td><td id="roleName">—</td></tr>
      <tr><td>手机号码</td><td id="phone">—</td></tr>
      <tr><td>最后登录</td><td id="lastLogin">—</td></tr>
    </table>
  </section>

  <section class="card">
    <h3>修改基础信息</h3>
    <p>真实姓名：<input id="newName" style="max-width:200px"> 手机号：<input id="newPhone" style="max-width:200px"></p>
    <button class="btn-primary" onclick="updateProfile()">保存修改</button>
  </section>

  <section class="card">
    <h3>修改密码</h3>
    <p>原密码：<input type="password" id="oldPwd" style="max-width:240px"></p>
    <p>新密码：<input type="password" id="newPwd" style="max-width:240px"></p>
    <p class="muted">提示：修改密码需要验证原密码。新密码至少 8 位，需包含字母和数字。</p>
    <button class="btn-primary" onclick="changePwd()">修改密码</button>
  </section>
</main>
<script src="/static/common.js"></script>
<script>
async function loadProfile() {
  const r = await fetch('/api/auth/profile');
  if (r.status === 401) { location.href = '/login'; return; }
  const d = await r.json();
  if (d.code !== 0) { showToast(d.msg, 'error'); return; }
  const u = d.data;
  document.getElementById('accountId').textContent = u.accountId;
  document.getElementById('username').textContent = u.username;
  document.getElementById('realName').textContent = u.realName;
  document.getElementById('roleName').textContent = u.roleName;
  document.getElementById('phone').textContent = u.phone || '未填写';
  document.getElementById('lastLogin').textContent = u.lastLoginAt || '—';
  document.getElementById('newName').value = u.realName;
  document.getElementById('newPhone').value = u.phone || '';
}
async function updateProfile() {
  const r = await fetch('/api/auth/profile/update', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({realName:document.getElementById('newName').value,
                         phone:document.getElementById('newPhone').value})});
  const d = await r.json();
  showToast(d.msg, d.code===0?'success':'error');
  if (d.code === 0) loadProfile();
}
async function changePwd() {
  const body = {oldPassword:document.getElementById('oldPwd').value,
                newPassword:document.getElementById('newPwd').value};
  const r = await fetch('/api/auth/password', {method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d = await r.json();
  showToast(d.msg, d.code===0?'success':'error');
  if (d.code === 0) { document.getElementById('oldPwd').value=''; document.getElementById('newPwd').value=''; }
}
loadProfile();
</script>
</body></html>
