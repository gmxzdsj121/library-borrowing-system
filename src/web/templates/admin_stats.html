<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>统计报表 - 图书借阅管理系统</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar"><div class="logo">借阅统计报表</div>
<div class="user-area"><a href="/home" class="link-btn">返回首页</a></div></header>
<main class="container">
    <h2 style="color:var(--primary);margin-bottom:16px">馆藏与借阅概况</h2>
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">图书总数</div><div class="stat-num" id="bookTotal">-</div></div>
        <div class="stat-card"><div class="stat-label">复本总数</div><div class="stat-num" id="copyTotal">-</div></div>
        <div class="stat-card"><div class="stat-label">在借数量</div><div class="stat-num" id="borrowed">-</div></div>
        <div class="stat-card"><div class="stat-label">可借数量</div><div class="stat-num" id="available">-</div></div>
        <div class="stat-card"><div class="stat-label">逾期数量</div><div class="stat-num" id="overdue" style="color:var(--danger)">-</div></div>
    </div>

    <h2 style="color:var(--primary);margin:24px 0 16px">罚款汇总（元）</h2>
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">罚款总额</div><div class="stat-num" id="fineTotal">-</div></div>
        <div class="stat-card"><div class="stat-label">已缴纳</div><div class="stat-num" id="finePaid" style="color:var(--success)">-</div></div>
        <div class="stat-card"><div class="stat-label">未缴纳</div><div class="stat-num" id="fineUnpaid" style="color:var(--danger)">-</div></div>
        <div class="stat-card"><div class="stat-label">已减免</div><div class="stat-num" id="fineWaived" style="color:var(--accent)">-</div></div>
    </div>

    <section class="card" style="margin-top:20px">
        <h3>热门图书 TOP 10</h3>
        <table class="grid">
            <thead><tr><th>排名</th><th>书名</th><th>作者</th><th>借阅次数</th></tr></thead>
            <tbody id="popularBody"></tbody>
        </table>
    </section>
</main>
<script src="/static/common.js"></script>
<script>
fetch('/api/stats/overview').then(r=>r.json()).then(d=>{
    var o=d.data;
    document.getElementById('bookTotal').textContent=o.bookTotal;
    document.getElementById('copyTotal').textContent=o.copyTotal;
    document.getElementById('borrowed').textContent=o.borrowed;
    document.getElementById('available').textContent=o.available;
    document.getElementById('overdue').textContent=o.overdue;
});
fetch('/api/stats/fine').then(r=>r.json()).then(d=>{
    var f=d.data;
    document.getElementById('fineTotal').textContent='¥'+Number(f.total).toFixed(2);
    document.getElementById('finePaid').textContent='¥'+Number(f.paid).toFixed(2);
    document.getElementById('fineUnpaid').textContent='¥'+Number(f.unpaid).toFixed(2);
    document.getElementById('fineWaived').textContent='¥'+Number(f.waived).toFixed(2);
});
fetch('/api/stats/popular?top=10').then(r=>r.json()).then(d=>{
    var tb=document.getElementById('popularBody');
    d.data.forEach(function(b,i){
        var tr=document.createElement('tr');
        var rank = i < 3 ? `<span class="status-tag status-warn">${i+1}</span>` : (i+1);
        tr.innerHTML='<td>'+rank+'</td><td>'+b.title+'</td><td>'+(b.author||'-')+'</td><td><span class="status-tag status-info">'+b.borrowTimes+'</span></td>';
        tb.appendChild(tr);
    });
});
</script>
</body>
</html>
