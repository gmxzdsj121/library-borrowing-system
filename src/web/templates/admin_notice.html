<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>通知公告</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar"><div class="logo">通知公告</div>
<div class="user-area"><a href="/home" class="link-btn">返回首页</a></div></header>
<main class="container">
<section class="card" id="publishBox" style="display:none">
    <h3 id="formTitle">发布公告</h3>
    <p>标题：<input type="text" id="noticeTitle" placeholder="请输入公告标题" style="max-width:480px"></p>
    <p>内容：<textarea id="noticeContent" rows="4" placeholder="请输入公告内容" style="resize:vertical;min-height:80px"></textarea></p>
    <input type="hidden" id="editId" value="">
    <button class="btn-primary" onclick="publish()">发布</button>
    <button class="btn-secondary" onclick="resetForm()">重置</button>
</section>
<section class="card">
    <h3>公告列表</h3>
    <div id="noticeList"></div>
</section>
</main>
<script src="/static/common.js"></script>
<script>
let isManager = false;
let editingId = null;

async function init() {
    const r = await fetch('/api/auth/me');
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();
    isManager = d.data && (d.data.role === 'LIBRARIAN' || d.data.role === 'AUDITOR');
    if (isManager) document.getElementById('publishBox').style.display = 'block';
    load();
}

function load() {
    fetch('/api/notice/list').then(r=>r.json()).then(d=>{
        const box = document.getElementById('noticeList');
        if (!d.data || !d.data.length) { box.innerHTML = '<p class="muted">暂无公告</p>'; return; }
        box.innerHTML = d.data.map(n => {
            let actions = '';
            if (isManager) {
                actions = `<div class="notice-actions">
                    <button class="btn-sm btn-secondary" onclick="editNotice(${n.noticeId})">编辑</button>
                    <button class="btn-sm btn-danger" onclick="delNotice(${n.noticeId})">删除</button>
                </div>`;
            }
            return `<div class="notice-item"><b>${n.title}</b><br><span>${n.content}</span>
                <br><span class="notice-time">${n.createdAt}</span>${actions}</div>`;
        }).join('');
    });
}

function resetForm() {
    editingId = null;
    document.getElementById('editId').value = '';
    document.getElementById('noticeTitle').value = '';
    document.getElementById('noticeContent').value = '';
    document.getElementById('formTitle').textContent = '发布公告';
}

function editNotice(id) {
    // 从列表中取当前公告数据填入表单
    fetch('/api/notice/list').then(r=>r.json()).then(d=>{
        const n = (d.data || []).find(x => x.noticeId === id);
        if (!n) return;
        editingId = id;
        document.getElementById('editId').value = id;
        document.getElementById('noticeTitle').value = n.title;
        document.getElementById('noticeContent').value = n.content;
        document.getElementById('formTitle').textContent = '编辑公告';
        document.getElementById('publishBox').scrollIntoView({behavior:'smooth'});
    });
}

function delNotice(id) {
    showConfirm('确定删除该公告吗？', function () {
        fetch('/api/notice/delete', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({noticeId:id})}).then(r=>r.json()).then(d=>{
            showToast(d.msg, d.code===0?'success':'error');
            if (d.code===0) load();
        });
    });
}

function publish() {
    const t = document.getElementById('noticeTitle').value.trim();
    const c = document.getElementById('noticeContent').value.trim();
    if (!t) { showToast('请填写标题', 'error'); return; }
    if (!c) { showToast('请填写内容', 'error'); return; }
    const url = editingId ? '/api/notice/update' : '/api/notice/publish';
    const body = editingId
        ? {noticeId: editingId, title:t, content:c}
        : {title:t, content:c};
    fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)}).then(r=>r.json()).then(d=>{
        showToast(d.msg, d.code===0?'success':'error');
        if (d.code===0) { resetForm(); load(); }
    });
}

init();
</script>
</body>
</html>
