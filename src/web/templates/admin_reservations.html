<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>预约审批</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar"><div class="logo">预约审批</div>
<div class="user-area"><a href="/home" class="link-btn">返回首页</a></div></header>
<main class="container">
  <section class="card">
    <h3>待审批预约申请</h3>
    <div id="list">加载中...</div>
  </section>
</main>
<script src="/static/common.js"></script>
<script>
async function load() {
  const r = await fetch('/api/reserve/pending');
  if (r.status === 401) { location.href='/login'; return; }
  const d = await r.json();
  if (d.code !== 0) { document.getElementById('list').textContent = d.msg; return; }
  if (!d.data.length) { document.getElementById('list').innerHTML = '<p class="muted">暂无待审批申请</p>'; return; }
  const rows = d.data.map(x => `
    <tr><td>${x.username}</td><td>${x.real_name||''}</td><td>${x.title}</td>
      <td>${x.isbn||'-'}</td><td>${x.borrow_days} 天</td><td>${x.created_at}</td>
      <td>
        <button class="btn-sm btn-success" onclick="approve(${x.reservation_id})">通过</button>
        <button class="btn-sm btn-danger" onclick="reject(${x.reservation_id})">拒绝</button>
      </td></tr>`).join('');
  document.getElementById('list').innerHTML =
    `<table class="grid"><tr><th>读者用户名</th><th>姓名</th><th>书名</th><th>ISBN</th><th>申请借阅</th><th>申请时间</th><th>操作</th></tr>${rows}</table>`;
}
async function approve(id) {
  const r = await fetch('/api/reserve/approve', {method:'POST',
    headers:{'Content-Type':'application/json'}, body:JSON.stringify({reservationId:id})});
  const d = await r.json();
  showToast(d.msg, d.code===0?'success':'error');
  if (d.code === 0) load();
}
function reject(id) {
  showPrompt('请输入拒绝理由（可选）：', '', function(reason) {
    fetch('/api/reserve/reject', {method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({reservationId:id, reason: reason||''})})
      .then(r=>r.json()).then(d=>{
        showToast(d.msg, d.code===0?'success':'error');
        if (d.code === 0) load();
      });
  });
}
load();
</script>
</body></html>
